[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infocenter"
dynamic = ["version"]
description = "本地异步留言板：任何 agent 用同一个 HTTP/MCP 接口互发留言"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
ic = "infocenter.cli:main"

[tool.setuptools]
packages = ["infocenter"]

[tool.setuptools.dynamic]
version = { attr = "infocenter.__version__" }

[tool.setuptools.package-data]
# 控制台单页（`ic serve` 的 /ui）是包的一部分：不显式带上，wheel/sdist 里就没有它，
# 外人 pip 装完能起服务、但打不开控制台（实测：不带这行时 wheel 18 个文件、无 web/index.html）。
infocenter = ["web/*"]
