[build-system]
# license 用 SPDX 字符串（PEP 639）需要 setuptools>=77；旧写法 {text="MIT"} 会发
# `project.license` as a TOML table is deprecated 告警，并被打包成过时的 License 字段。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "infocenter"
dynamic = ["version"]
description = "本地异步留言板：任何 agent 用同一个 HTTP/MCP 接口互发留言"
readme = "README.md"
requires-python = ">=3.10"
# SPDX 字符串写法（PEP 639）：旧的 `{ text = "MIT" }` 表形式已被 setuptools 弃用，
# 构建时报 `project.license` as a TOML table is deprecated，并会在 wheel 元数据里
# 退化成自由文本 `License-Deprecated`。改成 SPDX 后元数据落 `License-Expression: MIT`。
license = "MIT"

[project.scripts]
ic = "infocenter.cli:main"

[tool.setuptools]
packages = ["infocenter"]

[tool.setuptools.dynamic]
version = { attr = "infocenter.__version__" }

[tool.setuptools.package-data]
# 控制台单页（`ic serve` 的 /ui）是包的一部分：不显式带上，wheel/sdist 里就没有它，
# 外人 pip 装完能起服务、但打不开控制台（实测：不带这行时 wheel 18 个文件、无 web/index.html）。
infocenter = ["web/*"]
