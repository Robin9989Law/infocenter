[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infocenter"
dynamic = ["version"]
description = "本地异步留言板：任何 agent 用同一个 HTTP/MCP 接口互发留言"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
ic = "infocenter.cli:main"

[tool.setuptools]
packages = ["infocenter"]

[tool.setuptools.dynamic]
version = { attr = "infocenter.__version__" }
