<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息中心 · 管理台</title>
<style>
:root {
  --paper: #F4F1EA;
  --surface: #FFFCF8;
  --ink: #1C1915;
  --muted: #6B645B;
  --line: #E4DDD2;
  --copper: #B4532A;
  --copper-soft: #F6E8DF;
  --on-copper: #FFFCF8;
  --green: #1B7A4E;
  --green-soft: #E4F3EB;
  --blue: #1E4E89;
  --blue-soft: #E6EEF6;
  --amber: #9A6700;
  --amber-soft: #F8F0D8;
  --stone: #6E6862;
  --stone-soft: #EEEAE4;
  --violet: #5C4D8A;
  --violet-soft: #EEEAF6;
  --selected: #FBF6F0;
  --danger: #9F2D2D;
  --danger-soft: #F8E4E2;
  --shadow: 0 8px 24px rgba(28, 25, 21, 0.07);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
button, input, select, textarea { font-family: inherit; }
body {
  font-family: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--paper); color: var(--ink); padding: 24px;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--copper-soft); }
h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.topbar h1 { margin-bottom: 0; }
.brand { display: flex; align-items: center; gap: 12px; }
.titles { display: flex; flex-direction: column; gap: 2px; }
.kicker { font-size: 12px; color: var(--muted); font-weight: 400; }
.mark {
  width: 36px; height: 36px; border-radius: 12px; background: var(--copper); color: var(--on-copper);
  display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none;
}
.refresh {
  width: 32px; height: 32px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; cursor: pointer; display: grid; place-items: center; padding: 0; flex: none;
}
.refresh:hover { background: var(--paper); }
.refresh.spin { animation: spin 0.8s linear; }
.refresh.sm { width: 28px; height: 28px; }
.refresh svg { display: block; }
.restart-btn { background: var(--danger); color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; padding: 6px 12px; cursor: pointer; }
.restart-btn:hover { opacity: 0.92; }
.restart-btn:disabled { background: var(--stone-soft); color: var(--stone); cursor: default; opacity: 1; }
.head-tools { display: flex; align-items: center; gap: 8px; }
.subj { color: var(--copper); cursor: pointer; text-decoration: none; }
.subj:hover { text-decoration: underline; }
.body-text { white-space: pre-wrap; font-size: 13px; line-height: 1.55; word-break: break-word; }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.agents { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; font-size: 12px; color: var(--ink); white-space: nowrap; cursor: pointer;
}
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--stone); flex: none; }
.chip b { font-weight: 600; }
.chip .role { color: var(--copper); font-size: 11px; font-weight: 500; }
.chip .unread { color: var(--muted); margin-left: 2px; }
.chip.coord { border-color: var(--copper); }
.chip.coord::before { background: var(--copper); }
.chip.human { border-color: var(--green); }
.chip.human::before { background: var(--green); }
.chip:hover { background: var(--selected); }
.hd { color: var(--amber); font-size: 11px; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; align-items: stretch; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; height: 68vh;
}
.panel h2 { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--ink); flex: 0 0 auto; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; min-height: 28px; margin-bottom: 8px; flex: 0 0 auto; }
.panel-head h2 { margin-bottom: 0; }
.btn-new { background: var(--copper); color: var(--on-copper); border: none; border-radius: 8px; font-size: 12px; font-weight: 500; padding: 6px 12px; cursor: pointer; }
.btn-new:hover { opacity: 0.92; }
.link { background: none; border: none; color: var(--copper); cursor: pointer; font-size: 12px; font-weight: 500; margin-right: 10px; }
.tag { font-size: 10px; background: var(--stone-soft); color: var(--stone); padding: 1px 6px; border-radius: 999px; vertical-align: middle; font-weight: 500; }
.panel > div:not(.hint):not(.panel-head) { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.panel .hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; line-height: 1.45; flex: 0 0 auto; min-height: 2.8em; }
.panel.wide { height: auto; max-height: 42vh; margin-bottom: 8px; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters select, .filters input, .mini-select {
  font-size: 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink);
}
.filters input { min-width: 180px; }
.legend { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
.dmon-btn { display: inline-flex; align-items: center; gap: 4px; border: none; background: transparent; cursor: pointer; font-size: 12px; padding: 0; color: inherit; }
.dmon-btn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.dmon-btn.on { color: var(--green); }
.dmon-btn.off { color: var(--stone); }
.dmon-btn:hover { text-decoration: underline; }
.agents-wrap { display: flex; align-items: center; gap: 8px; }
.dir { font-size: 15px; font-weight: 700; }
.dir.out { color: var(--copper); }
.dir.in { color: var(--green); }
.item {
  position: relative; padding: 10px 12px; margin: 8px 0;
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  cursor: pointer; transition: background 0.15s, border-color 0.15s;
}
.item:hover { background: #F7F1E8; }
.item.active { background: var(--selected); color: var(--ink); border-color: var(--copper); }
.item.active:hover { background: var(--selected); }
.item .title { font-weight: 600; font-size: 13px; line-height: 1.4; }
.item .meta { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
.cid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); background: var(--stone-soft); padding: 1px 6px; border-radius: 6px; }
.copy { cursor: pointer; }
.copy:hover { text-decoration: underline; }
.copy.copied { color: var(--green) !important; }
.item.active .meta { color: var(--muted); }
.gear, .arch, .stat, .folder {
  position: absolute; width: 26px; height: 26px; display: grid; place-items: center;
  border: none; background: transparent; cursor: pointer; color: var(--muted);
  padding: 0; border-radius: 8px; opacity: 0.85;
}
.gear svg, .arch svg, .stat svg, .folder svg { display: block; pointer-events: none; }
.gear { top: 8px; right: 8px; }
.arch, .stat { top: 8px; right: 36px; }
.folder { top: 8px; right: 64px; }
.gear:hover, .arch:hover, .stat:hover, .folder:hover { opacity: 1; background: rgba(28, 25, 21, 0.06); }
.item.active .gear, .item.active .arch, .item.active .stat, .item.active .folder { color: var(--muted); opacity: 0.95; }
.item.has-arch { padding-right: 100px; }
.status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 1.45; white-space: nowrap; vertical-align: middle; }
.status.在办, .status.open, .status.doing { background: var(--green-soft); color: var(--green); }
.status.待谁, .status.待办, .status.waiting, .status.pending { background: var(--blue-soft); color: var(--blue); }
.status.暂停, .status.paused { background: var(--amber-soft); color: var(--amber); }
.status.中止, .status.离场, .status.aborted, .status.left { background: var(--stone-soft); color: var(--stone); }
.status.办结, .status.done { background: var(--violet-soft); color: var(--violet); }
.nodes { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.nodes th, .nodes td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.nodes th { color: var(--muted); font-weight: 500; font-size: 11.5px; white-space: nowrap; position: sticky; top: 0; background: var(--paper); z-index: 1; }
.nodes tbody tr:hover td { background: var(--selected); }
.nodes td.time { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.nodes td.action { white-space: nowrap; font-weight: 600; color: var(--copper); }
.nodes tr.auto td.note { color: var(--muted); font-style: italic; }
.nodes-title { font-size: 13px; color: var(--muted); margin: 4px 0 6px; }
.form-row { margin: 12px 0; }
.form-row label { display: block; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
.form-row input, .form-row textarea, .form-row select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: var(--surface); color: var(--ink); }
.form-row textarea { resize: vertical; min-height: 60px; }
.form-row input:focus, .form-row textarea:focus, .form-row select:focus,
.filters select:focus, .filters input:focus, .mini-select:focus { outline: 2px solid var(--copper-soft); border-color: var(--copper); }
.btn { padding: 5px 12px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; margin-right: 6px; }
.btn:hover { opacity: 0.88; }
.btn.pause { background: var(--amber-soft); color: var(--amber); }
.btn.resume { background: var(--green-soft); color: var(--green); }
.btn.abort { background: var(--stone-soft); color: var(--stone); }
.btn.close { background: var(--violet-soft); color: var(--violet); }
.btn.disable { background: var(--danger-soft); color: var(--danger); }
.btn-primary { background: var(--copper); color: var(--on-copper); padding: 8px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
.btn-primary:hover { opacity: 0.92; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); font-size: 13px; }
.kv { font-size: 13px; margin: 6px 0; line-height: 1.5; }
.kv b { color: var(--muted); font-weight: 500; margin-right: 8px; }
.quiet { color: var(--muted); font-size: 12px; }
.stale { color: #a16207; }
.settings-actions { margin: 14px 0 4px; }
.section-title { font-size: 13px; font-weight: 700; margin: 18px 0 8px; color: var(--ink); }
.section-title:first-child { margin-top: 0; }
.mini { padding: 8px 10px; margin: 4px 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 12.5px; }
.mini:hover { background: var(--selected); }
.irow { display: flex; align-items: center; gap: 6px; padding: 8px 10px; margin: 4px 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; }
.irow .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .btn { padding: 2px 8px; }
.irow.block { display: block; }
.irow details { margin-top: 4px; }
.irow summary { cursor: pointer; color: var(--copper); font-size: 12px; }
.irow details .body-text { margin-top: 6px; max-height: 240px; overflow: auto; background: var(--surface); padding: 8px; border-radius: 8px; border: 1px solid var(--line); }
hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
.modal-overlay { position: fixed; inset: 0; background: rgba(28, 25, 21, 0.38); display: none; align-items: center; justify-content: center; z-index: 50; }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: 720px; max-width: 92vw; max-height: 84vh; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(28, 25, 21, 0.22); }
.modal.wide { width: 1080px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 16px; font-weight: 700; }
.modal-close { border: none; background: transparent; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); width: 28px; height: 28px; border-radius: 8px; }
.modal-close:hover { color: var(--ink); background: var(--paper); }
.modal-body { padding: 16px 18px; overflow-y: auto; }
.panel > div:not(.hint):not(.panel-head)::-webkit-scrollbar,
.modal-body::-webkit-scrollbar { width: 8px; }
.panel > div:not(.hint):not(.panel-head)::-webkit-scrollbar-thumb,
.modal-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
@media (max-width: 1100px) {
  body { padding: 16px; }
  .grid { grid-template-columns: 1fr; }
  .panel { height: auto; max-height: 70vh; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="mark" aria-hidden="true">信</div><div class="titles"><h1>信息中心 · 管理台</h1><p class="kicker">项目 · WBS · 案卷 · 工作痕迹（会话在「项目团队会话」里，不进控制台）</p></div><button class="refresh" id="btn-refresh" title="刷新全部" aria-label="刷新全部"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button><button class="restart-btn" id="btn-restart" title="一键重启：服务端 + 全部运行中的项目守护">重启</button></div>
  <div class="agents-wrap"><button class="refresh sm" id="btn-r-agents" title="刷新 agent 状态"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button><div id="agents" class="agents"></div></div>
</div>

<div class="grid">
  <div class="panel">
    <div class="panel-head"><h2>项目</h2><span><button class="link" id="btn-toggle-archived">显示归档</button><button class="btn-new" id="btn-new-project">新建项目</button></span></div>
    <div class="hint">点一行选中 → 中间过滤；点齿轮 → 项目设置</div>
    <div id="projects"></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>WBS</h2><span class="head-tools"><button class="link" id="btn-sessions" title="项目团队会话：等同于人+agent 的会话进程，不进控制台">项目团队会话</button><button class="refresh sm" id="btn-r-wbs" title="刷新"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></span></div>
    <div class="hint">点一行选中 → 右边只看这个 WBS（含子路径）。WBS 是树；「未归类」= 还没归到某个 WBS 的案卷</div>
    <div id="wbs"></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>案卷</h2><span class="head-tools"><select id="f-case-status" class="mini-select"><option value="">全部状态</option></select><button class="refresh sm" id="btn-r-case" title="刷新"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></span></div>
    <div class="hint">案卷 = 控制包（只显示里程碑，不显示任务细节）。点一行 → 直接打开案卷设置</div>
    <div id="cases"></div>
  </div>
</div>

<div class="panel wide">
  <div class="panel-head">
    <h2>工作痕迹 <span class="legend">最近活动：项目 · WBS · 案卷 · 会话 · 节点 · 内容</span></h2>
    <div class="filters">
      <select id="f-proj"><option value="">全部项目</option></select>
      <select id="f-agent"><option value="">全部会话</option></select>
      <select id="f-case"><option value="">全部案卷</option></select>
      <input id="f-q" placeholder="关键词（内容/节点/案卷）">
      <button class="refresh sm" id="btn-r-act" title="刷新"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    </div>
  </div>
  <div id="activity"></div>
</div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="modal-close" id="modal-close" title="关闭">&times;</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// D3 应用管理台 · 三栏级联 + 设置弹窗
// 后端默认回退 human，浏览器直接 fetch

let state = {
  projects: [],
  windows: [],
  cases: [],
  agents: [],
  selectedProject: null,
  selectedWbs: null,
  selectedWindow: null,
  settingsTarget: null,
  showArchived: false,
  activity: [],
  activityFilters: { project: "", agent: "", case: "", q: "" },
  caseStatus: "",
  winState: "",
  mail: [],
  mailAgent: null,
  headless: [],
  daemons: [],
  runs: []
};

async function api(path, opts = {}) {
  const { method = "GET", body } = opts;
  const headers = { "X-Agent": "human" };
  if (body || method !== "GET") {
    headers["Content-Type"] = "application/json";
  }
  const res = await fetch(path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : (method !== "GET" ? "{}" : undefined)
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { const e = await res.json(); msg = e.error || e.message || msg; } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

async function loadProjects() {
  try { const data = await api("/v1/projects"); state.projects = data.projects || []; }
  catch (e) { console.error("loadProjects", e); }
  render();
}
async function loadWindows() {
  try { const data = await api("/v1/windows"); state.windows = data.windows || []; }
  catch (e) { console.error("loadWindows", e); }
  render();
}
async function loadCases() {
  try { const data = await api("/v1/cases"); state.cases = data.cases || []; }
  catch (e) { console.error("loadCases", e); }
  render();
}
async function loadAgents() {
  try { const data = await api("/v1/agents?probe_minutes=60"); state.agents = data.agents || []; }
  catch (e) { console.error("loadAgents", e); }
  render();
}
async function loadHeadless() {
  try { const data = await api("/v1/headless"); state.headless = data.headless || []; }
  catch (e) { console.error("loadHeadless", e); }
  render();
}
async function loadDaemons() {
  try { const data = await api("/v1/daemons"); state.daemons = data.daemons || []; }
  catch (e) { console.error("loadDaemons", e); }
  render();
}
async function loadRuns() {
  try { const data = await api("/v1/headless/runs?limit=50"); state.runs = data.runs || []; }
  catch (e) { console.error("loadRuns", e); }
  render();
}
function runBadge(r, idx) {
  const t = String((r && r.end) || "").replace("T", " ").slice(11, 16);
  const ok = r && r.outcome === "ok";
  return `<span class="run-badge ${ok ? "ok" : "bad"}" data-run-idx="${idx}" title="最近一轮 headless：${escapeHtml((r && r.agent) || "")} · ${escapeHtml((r && r.outcome) || "")} · ${escapeHtml(t)}（点击看上下文/输出）">&#9889; ${escapeHtml((r && r.agent) || "")} ${escapeHtml((r && r.outcome) || "")} ${escapeHtml(t)}</span>`;
}
async function loadActivity() {
  try { const data = await api("/v1/activity?limit=100"); state.activity = data.activity || []; }
  catch (e) { console.error("loadActivity", e); }
  render();
}
function syncActivityFilters() {
  const mk = (sel, first, opts, cur) => {
    const el = document.getElementById(sel);
    if (!el) return;
    el.innerHTML = `<option value="">${first}</option>` + opts.map(o => `<option value="${escapeHtml(o.v)}">${escapeHtml(o.t)}</option>`).join("");
    el.value = cur || "";
    if (el.value !== (cur || "")) el.value = "";
  };
  mk("f-proj", "全部项目", state.projects.map(p => ({ v: p.workspace, t: p.name || p.workspace })), state.activityFilters.project);
  mk("f-agent", "全部会话", state.agents.filter(a => a.roster !== false).map(a => ({ v: a.name, t: a.name })), state.activityFilters.agent);
  mk("f-case", "全部案卷", state.cases.map(c => ({ v: c.id, t: (c.title || c.id).slice(0, 30) })), state.activityFilters.case);
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function sameWs(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  const ba = String(a).split("/").filter(Boolean).pop();
  const bb = String(b).split("/").filter(Boolean).pop();
  return !!ba && ba === bb;
}

function selectProject(ws) {
  state.selectedProject = (state.selectedProject === ws) ? null : ws;
  state.selectedWindow = null;
  state.selectedWbs = null;
  render();
}

function buildWbsTree(cases) {
  const root = { name: "", path: "", children: [], count: 0, open: 0 };
  const byPath = new Map();
  const ensure = path => {
    if (byPath.has(path)) return byPath.get(path);
    const parts = path.split("/");
    const node = { name: parts[parts.length - 1], path, children: [], count: 0, open: 0 };
    byPath.set(path, node);
    const parentPath = parts.slice(0, -1).join("/");
    (parentPath ? ensure(parentPath) : root).children.push(node);
    return node;
  };
  for (const c of cases) {
    const path = c.wbs_path || "";
    const node = path ? ensure(path) : root;
    // 逐级计数，父节点含子树
    let cursor = path ? node : root;
    while (cursor) {
      cursor.count += 1;
      if (!c.sealed) cursor.open += 1;
      const parts = (cursor.path || "").split("/").filter(Boolean);
      cursor = parts.length > 1 ? byPath.get(parts.slice(0, -1).join("/")) : null;
    }
    if (!path) root.unassigned = (root.unassigned || 0) + 1;
  }
  const sort = node => {
    node.children.sort((a, b) => a.name.localeCompare(b.name, "zh"));
    node.children.forEach(sort);
  };
  sort(root);
  return root;
}

function renderWbsNodes(node, depth) {
  return node.children.map(child => `
    <div class="item ${state.selectedWbs === child.path ? 'active' : ''}" data-wbs="${escapeHtml(child.path)}" style="padding-left:${8 + depth * 14}px">
      <div class="title">${depth ? '<span class="quiet">└ </span>' : ''}${escapeHtml(child.name)}</div>
      <div class="meta">${child.count} 案卷${child.open ? ' · ' + child.open + " 未封卷" : ""}</div>
    </div>`).join("") + (depth === 0
      ? `<div class="item ${state.selectedWbs === "__none__" ? 'active' : ''}" data-wbs="__none__">
          <div class="title">未归类</div>
          <div class="meta">${node.unassigned || 0} 案卷（还没归到某个 WBS）</div>
        </div>`
      : "") + node.children.map(child => renderWbsNodes(child, depth + 1)).join("");
}

function selectWbs(path) {
  state.selectedWbs = (state.selectedWbs === path) ? null : path;
  state.selectedWindow = null;
  render();
}

  syncActivityFilters();
  // 项目
  const projEl = document.getElementById("projects");
  const shownProjects = state.projects.filter(p => state.showArchived || !p.archived);
  if (shownProjects.length === 0) {
    projEl.innerHTML = '<div class="empty">暂无项目</div>';
  } else {
    projEl.innerHTML = shownProjects.map(p => {
      const dcount = state.daemons.filter(d => d.alive && sameWs(d.dir, p.workspace)).length;
      return `
      <div class="item has-arch ${state.selectedProject === p.workspace ? 'active' : ''}" data-project-ws="${escapeHtml(p.workspace)}">
        <button class="folder" data-open-path="${escapeHtml(p.workspace)}" title="打开项目文件夹"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></button>
        <button class="arch" data-arch-id="${escapeHtml(p.workspace)}" title="${p.archived ? '取消归档' : '归档'}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg></button>
        <button class="gear" data-gear="project" data-gear-id="${escapeHtml(p.workspace)}" title="项目设置"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <div class="title">${escapeHtml(p.name || p.workspace)}${p.archived ? ' <span class="tag">已归档</span>' : ''}</div>
        <div class="meta"><button class="dmon-btn ${dcount ? 'on' : 'off'}" data-dmon-ws="${escapeHtml(p.workspace)}" title="${dcount ? '点击：停止该项目全部守护（会话离场；不再自动封卷案卷）' : '点击：启动该项目全部收信守护'}">守护 ${dcount}</button> · ${p.case_count || 0}案 ${p.active_cases || 0}在办</div>
      </div>`;
    }).join("");
    wire(projEl, ".item[data-project-ws]", it => selectProject(it.dataset.projectWs));
  }

  // WBS（树：从案卷的 wbs_path 派生；不建表）
  const wbsEl = document.getElementById("wbs");
  const scopable = state.selectedProject
    ? state.cases.filter(c => sameWs(c.workspace, state.selectedProject))
    : state.cases;
  const tree = buildWbsTree(scopable);
  if (tree.children.length === 0) {
    wbsEl.innerHTML = `<div class="empty">${state.selectedProject ? "该项目暂无 WBS（案卷还没归类）" : "暂无 WBS"}</div>`;
  } else {
    wbsEl.innerHTML = renderWbsNodes(tree, 0);
    wire(wbsEl, ".item[data-wbs]", it => selectWbs(it.dataset.wbs));
  }

  // 案件
  const caseEl = document.getElementById("cases");
  const caseStatusSel = document.getElementById("f-case-status");
  if (caseStatusSel) {
    const labels = [...new Set(state.cases.map(c => c.status_label || c.status).filter(Boolean))];
    caseStatusSel.innerHTML = '<option value="">全部状态</option>' + labels.map(l => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join("");
    caseStatusSel.value = state.caseStatus || "";
  }
  const selWin = state.selectedWindow ? state.windows.find(w => (w.window_id || w.id) === state.selectedWindow) : null;
  let shownCases = state.selectedWindow
    ? state.cases.filter(c => c.owner_window === state.selectedWindow
        || (!c.owner_window && selWin && c.owner_agent === selWin.agent))
    : (state.selectedProject ? state.cases.filter(c => sameWs(c.workspace, state.selectedProject)) : state.cases);
  if (state.selectedWbs !== null) {
    const want = state.selectedWbs;
    shownCases = shownCases.filter(c => want === "__none__"
      ? !(c.wbs_path || "")
      : ((c.wbs_path || "") === want || (c.wbs_path || "").startsWith(want + "/")));
  }
  if (state.caseStatus) shownCases = shownCases.filter(c => (c.status_label || c.status) === state.caseStatus);
  if (shownCases.length === 0) {
    caseEl.innerHTML = `<div class="empty">${state.selectedWindow ? "该会话暂无案卷" : (state.selectedWbs !== null ? "该 WBS 下暂无案卷" : (state.selectedProject ? "该项目暂无案卷" : "暂无案卷"))}</div>`;
  } else {
    caseEl.innerHTML = shownCases.map(c => {
      const raw = c.status || "";
      const st = c.status_label || raw;
      const cls = (raw || st).replace(/[^a-zA-Z\u4e00-\u9fa5]/g, "");
      const owner = c.owner_agent || c.owner_window || "";
      const last = c.last_note || (c.last_node && typeof c.last_node === "object" ? (c.last_node.note || c.last_node.line || "") : c.last_node) || "";
      const cid = escapeHtml(c.id);
      const runIdx = state.runs.findIndex(r => sameWs(r.dir, c.workspace) && (!c.owner_agent || r.agent === c.owner_agent));
      return `
      <div class="item" data-case-id="${cid}">
        <div class="title">${escapeHtml(c.title)}${runIdx >= 0 ? runBadge(state.runs[runIdx], runIdx) : ''}</div>
        <div class="meta"><span class="cid copy" data-copy="${cid}" title="点击复制案卷编号">${cid}</span> <span class="status ${cls}">${escapeHtml(st)}</span> ${owner ? '主办 ' + escapeHtml(owner) : ''}</div>
        <div class="meta">[${escapeHtml(c.wbs_path || "未归类")}]${(c.milestones_total || 0) ? ' · 里程碑 ' + (c.milestones_done || 0) + '/' + c.milestones_total : ''}</div>
        ${c.acceptance ? `<div class="meta">怎样算完：${escapeHtml(c.acceptance)}</div>` : (c.sealed ? '' : '<div class="meta stale">⚠ 没写「怎样算完」——做成什么算做成，没人说得清</div>')}
        ${(c.human_stale || c.stalled) ? `<div class="meta stale">${[c.human_stale ? '⚠ 人话过期（等 coordinator 重写）' : '', c.stalled ? '⚠ 停滞 ' + c.stalled_hours + 'h（没人动，看看要不要叫人/收工）' : ''].filter(Boolean).join(' · ')}</div>` : ''}
        <div class="meta">${escapeHtml(c.human_note || last)}</div>
      </div>`;
    }).join("");
    wire(caseEl, ".item[data-case-id]", it => openSettings("case", it.dataset.caseId));
  }

  // 工作痕迹
  const actEl = document.getElementById("activity");
  if (actEl) {
    const f = state.activityFilters;
    const acts = state.activity.filter(a => {
      if (f.project && !sameWs(a.workspace, f.project)) return false;
      if (f.agent && a.agent !== f.agent) return false;
      if (f.case && a.case_id !== f.case) return false;
      if (f.q) {
        const hay = (a.action || "") + " " + (a.note || "") + " " + (a.case_title || "");
        if (!hay.includes(f.q)) return false;
      }
      return true;
    });
    if (acts.length === 0) {
      actEl.innerHTML = '<div class="empty">无匹配活动</div>';
    } else {
      actEl.innerHTML = `<table class="nodes"><thead><tr><th>时间</th><th>项目</th><th>会话</th><th>案卷</th><th>节点</th><th>内容</th></tr></thead><tbody>`
        + acts.map(a => {
            const p = state.projects.find(x => sameWs(x.workspace, a.workspace));
            const proj = p ? (p.name || p.workspace) : (a.workspace ? String(a.workspace).split("/").filter(Boolean).pop() : "");
            const office = (a.agent || "") + (a.window_id ? " · " + a.window_id : "");
            return `<tr class="${a.auto ? 'auto' : ''}">
            <td class="time">${escapeHtml(a.created_at_beijing || "")}</td>
            <td>${escapeHtml(proj)}</td>
            <td>${escapeHtml(office)}</td>
            <td title="${escapeHtml(a.case_title || "")}">${a.case_id ? '<span class="cid copy" data-copy="' + escapeHtml(a.case_id) + '">' + escapeHtml(a.case_id) + '</span>' : "—"}</td>
            <td class="action">${escapeHtml(a.action || "")}${a.auto ? ' [自动]' : ''}</td>
            <td class="note">${escapeHtml(a.note || "")}</td>
          </tr>`;
          }).join("")
        + `</tbody></table>`;
    }
  }

  // 顶部 agent 状态
  const agEl = document.getElementById("agents");
  if (agEl) {
    const ordered = state.agents.filter(a => a.roster !== false)
      .sort((a, b) => (a.name === "human" ? 1 : 0) - (b.name === "human" ? 1 : 0));
    agEl.innerHTML = ordered.map(a => {
      const isHuman = a.name === "human";
      const hd = state.headless.some(h => h.agent === a.name && h.alive);
      return `<span class="chip ${a.role === "coordinator" ? "coord" : ""} ${isHuman ? "human" : ""}" data-agent="${escapeHtml(a.name)}" title="${escapeHtml(a.activity || "")}">
        <b>${escapeHtml(a.name)}</b>${a.role === "coordinator" ? '<span class="role">coord</span>' : ""}${hd ? ' <span class="hd" title="headless 正在跑">&#9889;</span>' : ""}<span class="unread">未读 ${a.unread || 0}</span>${a.probe ? `<span class="${a.probe.verdict === 'ok' || a.probe.verdict === 'quiet' ? 'unread' : 'stale'}" title="${escapeHtml(a.probe.why || '')}——最近 ${a.probe.minutes} 分钟的 headless 触发数 / 产出（机械动作 ${a.probe.machinery} 次不算产出）${a.probe.truncated ? '；触发数只是下限' : ''}">触发 ${a.probe.triggers}/产出 ${a.probe.produced}</span>` : ""}
      </span>`;
    }).join("");
    agEl.querySelectorAll(".chip[data-agent]").forEach(c => c.addEventListener("click", () => openSettings(c.dataset.agent === "human" ? "human" : "agent", c.dataset.agent)));
  }

  function wire(root, sel, onClick) {
    root.querySelectorAll(sel).forEach(item => item.addEventListener("click", () => onClick(item)));
    root.querySelectorAll(".gear").forEach(g => g.addEventListener("click", ev => {
      ev.stopPropagation();
      openSettings(g.dataset.gear, g.dataset.gearId);
    }));
    root.querySelectorAll(".arch").forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      toggleArchive(b.dataset.archId);
    }));
    root.querySelectorAll(".stat").forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      openSettings("window-status", b.dataset.statWindow);
    }));
    root.querySelectorAll(".dmon-btn").forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      toggleDaemons(b.dataset.dmonWs);
    }));
    root.querySelectorAll(".run-badge").forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      openSettings("run", b.dataset.runIdx);
    }));
    root.querySelectorAll(".folder").forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      openProjectDir(b.dataset.openPath);
    }));
  }
}

      <div class="kv"><b>最近活动</b>${escapeHtml(w.activity_at_beijing || w.last_seen_beijing || "")}</div>
      ${w.activity ? `<div class="kv"><b>在做什么</b>${escapeHtml(w.activity)}</div>` : ""}
      <div class="kv"><b>名下未封卷案卷</b>${w.case_count != null ? w.case_count : (w.cases || []).length} 份</div>
      <div class="settings-actions"><button class="btn resume" data-act="refresh-stat">刷新</button></div>

      <div class="section-title">历史痕迹（${traces.length}）</div>
      ${traces.length === 0 ? '<div class="empty">暂无痕迹</div>' : `<table class="nodes"><thead><tr><th>时间</th><th>节点</th><th>内容</th><th>案卷</th></tr></thead><tbody>`
        + traces.map(a => `<tr class="${a.auto ? 'auto' : ''}">
            <td class="time">${escapeHtml(a.created_at_beijing || "")}</td>
            <td class="action">${escapeHtml(a.action || "")}${a.auto ? ' [自动]' : ''}</td>
            <td class="note">${escapeHtml(a.note || "")}</td>
            <td>${escapeHtml(a.case_title || "")}</td>
          </tr>`).join("") + `</tbody></table>`}`;
    overlay.classList.add("show");
    return;
  }

  if (kind === "human") {
    const opts = state.agents.filter(a => a.roster !== false && a.name !== "human").map(a => `<option value="${escapeHtml(a.name)}">${escapeHtml(a.name)}</option>`).join("");
    const offices = state.windows.filter(w => w.state !== "left");
    const openCases = state.cases.filter(c => !c.sealed);
    titleEl.textContent = "human · 干预中枢";
    bodyEl.innerHTML = `
      <div class="section-title">① 发信（下指令）</div>
      <div class="form-row"><label>收件人（可多选；「★ 所有 agent」= 广播）</label>
        <select id="s-msg-to" multiple size="4">
          <option value="*">★ 所有 agent（广播）</option>
          ${opts}
        </select>
      </div>
      <div class="form-row"><label>项目（决定守护是否自动开工）</label>
        <select id="s-msg-ws">
          <option value="">（不带项目）</option>
          <option value="*">★ 所有项目（逐个广播）</option>
          ${state.projects.filter(p => !p.archived).map(p => `<option value="${escapeHtml(p.workspace)}">${escapeHtml(p.name || p.workspace)}</option>`).join("")}
        </select>
      </div>
      <div class="form-row"><label>主题</label><input id="s-msg-subject" placeholder="主题"></div>
      <div class="form-row"><label>正文</label><textarea id="s-msg-body" placeholder="正文（可留空）"></textarea></div>
      <button class="btn-primary" data-act="send-human">发送</button>

      <div class="section-title">② 在跑会话（${offices.length}）· 可直接干预</div>
      ${offices.length === 0 ? '<div class="empty">无</div>' : offices.map(w => {
        const st = w.state_label || w.state || "";
        const wid = escapeHtml(w.window_id || w.id);
        const proj = w.workspace ? String(w.workspace).split("/").filter(Boolean).pop() : "";
        const canPause = st === "在办";
        const act = w.activity ? " · " + escapeHtml(String(w.activity).slice(0, 36)) : "";
        return `<div class="irow">
          <span class="grow"><b>${escapeHtml(w.agent)}</b> · ${escapeHtml(proj)} · <span class="cid">${wid}</span> · ${escapeHtml(st)}${act}</span>
          ${canPause ? `<button class="btn pause" data-act="pause-window" data-wid="${wid}">暂停</button>` : `<button class="btn resume" data-act="resume-window" data-wid="${wid}">恢复</button>`}
          <button class="btn disable" data-act="disable-window" data-wid="${wid}">离场</button>
        </div>`;
      }).join("")}

      <div class="section-title">③ 在跑 headless（${state.headless.filter(h => h.alive).length}）· 可看运行时上下文</div>
      ${state.headless.length === 0 ? '<div class="empty">无</div>' : state.headless.map(h => `
        <div class="irow block"><span class="grow"><b>${escapeHtml(h.agent)}</b> · ${escapeHtml(String(h.dir).split("/").filter(Boolean).pop() || "")} · pid ${escapeHtml(String(h.pid))} · ${h.alive ? "运行中" : "已退出"}</span>
          ${h.prompt ? `<details><summary>运行时上下文</summary><div class="body-text">${escapeHtml(h.prompt)}</div></details>` : ""}
        </div>`).join("")}
      <div class="section-title">④ 未结案卷（${openCases.length}）· 可直接干预</div>
      ${openCases.length === 0 ? '<div class="empty">无</div>' : openCases.map(c => {
        const st = c.status_label || c.status || "";
        const cid = escapeHtml(c.id);
        return `<div class="irow">
          <span class="grow">${escapeHtml(c.title)} · <span class="cid">${cid}</span> · ${escapeHtml(st)}</span>
          <button class="btn abort" data-act="abort-case" data-cid="${cid}">中止</button>
          <button class="btn close" data-act="close-case" data-cid="${cid}">办结</button>
        </div>`;
      }).join("")}

      <div class="section-title">⑤ human 的信件往来</div>
      <div id="s-agent-mail"><div class="empty">加载…</div></div>`;
    overlay.classList.add("show");
    loadAgentMail("human");
    return;
  }

  if (kind === "agent") {
    titleEl.textContent = "信件往来 · " + id;
    bodyEl.innerHTML = '<div id="s-agent-mail"><div class="empty">加载…</div></div>';
    overlay.classList.add("show");
    loadAgentMail(id);
    return;
  }

  if (kind === "message") {
    const m = (state.mail || []).find(x => x.id === id) || {};
    const p = state.projects.find(x => sameWs(x.workspace, m.workspace));
    const proj = p ? (p.name || p.workspace) : (m.workspace || "");
    titleEl.textContent = "信件 · " + (m.subject || id);
    bodyEl.innerHTML = `
      <button class="btn resume" data-act="back-mail">← 返回</button>
      <div class="kv"><b>时间</b>${escapeHtml(m.created_at_beijing || "")}</div>
      <div class="kv"><b>方向</b>${m.direction === "out" ? "发出 → " + escapeHtml((m.to || []).join(", ")) : "← 收到 " + escapeHtml(m.other || "")}</div>
      <div class="kv"><b>项目</b>${escapeHtml(proj)}</div>
      <div class="kv"><b>会话</b>${escapeHtml(m.claimed_by || "—")}</div>
      <div class="kv"><b>案卷</b>${escapeHtml(m.case_title || m.case_id || "—")}</div>
      <hr>
      <div class="body-text">${escapeHtml(m.body || "（无正文）")}</div>`;
    overlay.classList.add("show");
    return;
  }

  if (kind === "run") {
    const r = (state.runs || [])[Number(id)] || {};
    titleEl.textContent = "headless 运行 · " + (r.agent || "");
    bodyEl.innerHTML = `
      <div class="kv"><b>身份</b>${escapeHtml(r.agent || "")}</div>
      <div class="kv"><b>项目</b>${escapeHtml(r.dir || "")}</div>
      <div class="kv"><b>结果</b>${escapeHtml(r.outcome || "")} · ${escapeHtml(String(r.start || "").replace("T", " ").replace("Z", ""))} → ${escapeHtml(String(r.end || "").replace("T", " ").replace("Z", ""))}</div>
      <hr>
      <div class="kv"><b>运行时上下文（提示词）</b></div>
      <div class="body-text">${escapeHtml(r.prompt || "（无）")}</div>
      <hr>
      <div class="kv"><b>输出</b></div>
      <div class="body-text">${escapeHtml(r.tail || "（无）")}</div>`;
    overlay.classList.add("show");
    return;
  }

  if (kind === "case") {
    const c = state.cases.find(x => x.id === id) || {};
    const raw = c.status || "";
    const st = c.status_label || raw;
    const isSealed = Boolean(c.sealed) || ["aborted", "done"].includes(raw) || st === "中止" || st === "办结";
    const canPause = ["open", "doing", "pending", "waiting"].includes(raw) || (!raw && st === "在办");
    const canResume = raw === "paused" || (!raw && st === "暂停");
    titleEl.textContent = "案卷设置 · " + (c.title || id);
    bodyEl.innerHTML = `
      <div class="kv"><b>案卷编号</b><span class="cid copy" data-copy="${escapeHtml(id)}" title="点击复制">${escapeHtml(id)}</span></div>
      <div class="kv"><b>标题</b>${escapeHtml(c.title || "")}</div>
      <div class="kv"><b>WBS</b>${escapeHtml(c.wbs_path || "（未归类）")}</div>
      <div class="kv"><b>人话</b>${escapeHtml(c.human_note || "（还没有：看板上的说法只由 coordinator 写）")}${c.human_stale ? ' <span class="stale">⚠ 人话过期</span>' : ''}</div>
      <div class="kv"><b>怎样算完</b>${c.acceptance ? escapeHtml(c.acceptance) : '<span class="stale">还没写</span>（做成什么算做成，得有人写清：`ic case ' + escapeHtml(id) + ' --acceptance "…"`）'}</div>
      <div class="kv"><b>里程碑</b>${(c.milestones || []).length === 0 ? "—"
        : c.milestones.map((m, i) => `<div>${m.done ? "✔" : "·"} ${escapeHtml(m.name)}${m.owner ? "（" + escapeHtml(m.owner) + "）" : ""}</div>`).join("")}</div>
      <div class="kv"><b>状态</b>${escapeHtml(st)}</div>
      <div class="kv"><b>主办</b>${escapeHtml(c.owner_agent || c.owner_window || "—")}</div>
      <div class="kv"><b>项目</b>${escapeHtml(c.workspace || "—")}</div>
      <div class="settings-actions">
        ${canPause ? '<button class="btn pause" data-act="pause-case">暂停</button>' : ""}
        ${canResume ? '<button class="btn resume" data-act="resume-case">恢复</button>' : ""}
        ${!isSealed ? '<button class="btn abort" data-act="abort-case">中止</button>' : ""}
        ${!isSealed ? '<button class="btn close" data-act="close-case">办结</button>' : ""}
        ${isSealed ? '<button class="btn resume" data-act="reopen-case">重开此案卷</button>' : ""}
      </div>
      ${isSealed ? '<div class="kv quiet">已封卷（只读）。要接着办，请「重开」。</div>' : ""}
      <hr>
      <div class="nodes-title">节点时间线</div>
      <div id="s-case-nodes"><div class="empty">加载节点…</div></div>`;
    overlay.classList.add("show");
    loadCaseNodes(id);
    return;
  }
}

function openSessions() {
  const overlay = document.getElementById("modal-overlay");
  const titleEl = document.getElementById("modal-title");
  const bodyEl = document.getElementById("modal-body");
  const wins = state.selectedProject
    ? state.windows.filter(w => sameWs(w.workspace, state.selectedProject))
    : state.windows;
  titleEl.textContent = "项目团队会话（" + wins.length + "）";
  bodyEl.innerHTML = `
    <div class="kv quiet">会话 = 人和 agent 的一次运行上下文（原「办公室」）。它只负责并发隔离与认领，**不是业务概念**，所以不进控制台三层（项目 / WBS / 案卷）。</div>
    <hr>
    ${wins.length === 0 ? '<div class="empty">暂无会话</div>' : wins.map(w => {
      const wid = escapeHtml(w.window_id || w.id);
      const st = escapeHtml(w.state_label || w.state || "");
      return `<div class="mini">
        <div><b>${escapeHtml(w.agent)}</b> · ${wid} · ${st}</div>
        <div class="quiet">${escapeHtml(w.workspace || "")}</div>
        <div class="quiet">${w.activity ? escapeHtml(w.activity) : (w.case_count || 0) + " 案"} · 最近 ${escapeHtml(w.last_seen_beijing || "")}</div>
        <div class="settings-actions">
          <button class="btn resume" data-act="open-window-settings" data-wid="${wid}">会话设置</button>
          <button class="btn" data-act="open-window-status" data-wid="${wid}">实时状态</button>
        </div>
      </div>`;

function closeSettings() {
  document.getElementById("modal-overlay").classList.remove("show");
  state.settingsTarget = null;
}

async function loadCaseNodes(id) {
  const el = document.getElementById("s-case-nodes");
  if (!el) return;
  try {
    const c = await api("/v1/cases/" + encodeURIComponent(id));
    const nodes = c.nodes || [];
    el.innerHTML = nodes.length === 0 ? '<div class="empty">暂无节点</div>' : `
      <table class="nodes">
        <thead><tr><th>节点</th><th>时间</th><th>操作人</th><th>内容</th></tr></thead>
        <tbody>${nodes.map(n => `
          <tr class="${n.auto ? 'auto' : ''}">
            <td class="action">${escapeHtml(n.action || "")}${n.auto ? ' [自动]' : ''}</td>
            <td class="time">${escapeHtml(n.created_at_beijing || "")}</td>
            <td>${escapeHtml(n.agent || "")}</td>
            <td class="note">${escapeHtml(n.note || "")}</td>
          </tr>`).join("")}</tbody>
      </table>`;
  } catch (e) {
    el.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

async function saveProject() {
  const id = state.settingsTarget && state.settingsTarget.id;
  const name = document.getElementById("s-proj-name").value.trim();
  try {
    await api("/v1/projects", { method: "POST", body: { workspace: id, name: name || undefined } });
    closeSettings(); await loadProjects();
  } catch (e) { alert("保存失败：" + e.message); }
}
async function markRead(id, name) {
  try {
    await api("/v1/messages/" + encodeURIComponent(id) + "/read", { method: "POST" });
    await loadAgentMail(name);
    await loadAgents();
  } catch (e) { alert("标为已读失败：" + e.message); }
}
async function sendHuman() {
  const sel = document.getElementById("s-msg-to");
  const to = Array.from(sel.selectedOptions).map(o => o.value);
  const subject = document.getElementById("s-msg-subject").value.trim();
  const body = document.getElementById("s-msg-body").value;
  const wsEl = document.getElementById("s-msg-ws");
  const ws = wsEl ? wsEl.value : "";
  if (to.length === 0) { alert("请选收件人"); return; }
  if (!subject) { alert("请填主题"); return; }
  const toStr = to.join(",");
  try {
    if (ws === "*") {
      const projects = state.projects.filter(p => !p.archived);
      if (projects.length === 0) { alert("没有可广播的项目"); return; }
      for (const p of projects) {
        await api("/v1/messages", { method: "POST", body: { to: toStr, subject, body, workspace: p.workspace } });
      }
      alert("已广播到 " + projects.length + " 个项目");
    } else {
      const payload = { to: toStr, subject, body };
      if (ws) payload.workspace = ws;
      await api("/v1/messages", { method: "POST", body: payload });
      alert("已发送" + (ws ? "（带项目，守护会开工）" : "（无项目，仅交互会话可见）"));
    }
    closeSettings();
    await loadAgents(); await loadActivity();
  } catch (e) { alert("发送失败：" + e.message); }
}
async function loadAgentMail(name) {
  const el = document.getElementById("s-agent-mail");
  if (!el) return;
  try {
    const data = await api("/v1/agents/" + encodeURIComponent(name) + "/messages?limit=100");
    const msgs = data.messages || [];
    state.mail = msgs;
    state.mailAgent = name;
    el.innerHTML = msgs.length === 0 ? '<div class="empty">暂无信件</div>' : `<table class="nodes"><thead><tr><th>时间</th><th>方向</th><th>对方</th><th>项目</th><th>会话室</th><th>案卷</th><th>主题</th><th>状态</th></tr></thead><tbody>`
      + msgs.map(m => {
          const p = state.projects.find(x => sameWs(x.workspace, m.workspace));
          const proj = p ? (p.name || p.workspace) : (m.workspace ? String(m.workspace).split("/").filter(Boolean).pop() : "");
          const dir = m.direction === "out"
            ? '<span title="发出" class="dir out">&#10145;</span>'
            : '<span title="收到" class="dir in">&#11013;</span>';
          const st = m.direction === "out" ? "" : (m.my_status === "unread" ? "未读" : m.my_status === "read" ? "已读" : m.my_status === "archived" ? "归档" : (m.my_status || ""));
          const canRead = name === "human" && m.direction === "in" && m.my_status === "unread";
          const stCell = canRead
            ? `<button class="btn resume" data-read="${escapeHtml(m.id)}">标为已读</button>`
            : escapeHtml(st);
          return `<tr>
          <td class="time">${escapeHtml(m.created_at_beijing || "")}</td>
          <td>${dir}</td>
          <td>${escapeHtml(m.other || "")}</td>
          <td>${escapeHtml(proj)}</td>
          <td title="会话编号（点击复制）">${m.claimed_by ? '<span class="cid copy" data-copy="' + escapeHtml(m.claimed_by) + '">' + escapeHtml(m.claimed_by) + '</span>' : "—"}</td>
          <td title="${escapeHtml(m.case_title || "")}">${m.case_id ? '<span class="cid copy" data-copy="' + escapeHtml(m.case_id) + '">' + escapeHtml(m.case_id) + '</span>' : "—"}</td>
          <td><a class="subj" data-msgid="${escapeHtml(m.id)}" title="点击看正文">${escapeHtml(m.subject || "")}</a></td>
          <td>${stCell}</td>
        </tr>`;
        }).join("")
      + `</tbody></table>`;
    el.querySelectorAll("[data-read]").forEach(b => b.addEventListener("click", () => markRead(b.dataset.read, name)));
    el.querySelectorAll("[data-msgid]").forEach(a => a.addEventListener("click", ev => { ev.stopPropagation(); openSettings("message", a.dataset.msgid); }));
  } catch (e) {
    el.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

async function openProjectDir(p) {
  try { await api("/v1/open", { method: "POST", body: { path: p } }); }
  catch (e) { alert("打开失败：" + e.message); }
}
async function toggleDaemons(ws) {
  const dcount = state.daemons.filter(d => d.alive && sameWs(d.dir, ws)).length;
  const action = dcount > 0 ? "down" : "up";
  const name = (state.projects.find(p => p.workspace === ws) || {}).name || ws;
  if (action === "down" && !confirm("停止项目「" + name + "」的全部收信守护？\n会离场，并自动中止且封卷其名下全部未封卷案卷。")) return;
  if (action === "up" && !confirm("启动项目「" + name + "」的全部收信守护（让 agent 上线开工）？")) return;
  try {
    const r = await api("/v1/crew", { method: "POST", body: { action, dir: ws } });
    alert((r.lines || []).join("\n") || "完成");
    await loadDaemons(); await loadWindows(); await loadCases(); await loadProjects();
  } catch (e) { alert("操作失败：" + e.message); }
}
async function refreshWindowStatus() {
  const id = state.settingsTarget && state.settingsTarget.id;
  await loadWindows(); await loadActivity();
  if (id) openSettings("window-status", id);
}
async function crewAction(action) {
  const id = state.settingsTarget && state.settingsTarget.id;
  if (action === "up") {
    const n = state.cases.filter(x => sameWs(x.workspace, id)).length;
    if (n === 0 && !confirm("该项目还没有案卷（没走 ① 立案）。仍要启动守护吗？")) return;
  }
  try {
    const r = await api("/v1/crew", { method: "POST", body: { action, dir: id } });
    alert((r.lines || []).join("\n") || "完成");
    closeSettings(); await loadWindows(); await loadProjects();
  } catch (e) { alert("操作失败：" + e.message); }
}
async function toggleArchive(ws) {
  const p = state.projects.find(x => x.workspace === ws);
  const arch = !(p && p.archived);
  if (arch && !confirm("归档项目「" + ((p && p.name) || ws) + "」？归档后主界面默认隐藏，可随时取消。")) return;
  try { await api("/v1/projects", { method: "POST", body: { workspace: ws, archived: arch } }); await loadProjects(); }
  catch (e) { alert("操作失败：" + e.message); }
}
async function archiveProject(flag) {
  const id = state.settingsTarget && state.settingsTarget.id;
  try {
    await api("/v1/projects", { method: "POST", body: { workspace: id, archived: flag } });
    closeSettings(); await loadProjects();
  } catch (e) { alert((flag ? "归档" : "取消归档") + "失败：" + e.message); }
}
async function createProject() {
  const path = document.getElementById("np-path").value.trim();
  const name = document.getElementById("np-name").value.trim();
  if (!path) { alert("请填写目录路径"); return; }
  try {
    await api("/v1/projects", { method: "POST", body: { workspace: path, name: name || undefined } });
    closeSettings(); await loadProjects();
  } catch (e) { alert("纳入失败：" + e.message); }
}
async function createCaseFromSettings() {
  const id = state.settingsTarget && state.settingsTarget.id;
  const title = document.getElementById("s-case-title").value.trim();
  const text = document.getElementById("s-case-body").value.trim();
  const assign = document.getElementById("s-case-assign").value;
  if (!title) { alert("请填写案卷标题"); return; }
  const payload = { title, workspace: id };
  if (assign) { payload.to = assign; payload.body = text || title; } // 立案并同时发始信
  else { payload.note = text || undefined; }                         // 只建案卷
  try {
    await api("/v1/cases", { method: "POST", body: payload });
    closeSettings(); await loadCases(); await loadProjects(); await loadActivity();
  } catch (e) { alert("立案失败：" + e.message); }
}
async function doWindow(action, widOpt) {
  const id = widOpt || (state.settingsTarget && state.settingsTarget.id);
  try {
    if (action === "pause") await api("/v1/windows/" + encodeURIComponent(id) + "/pause", { method: "POST" });
    else if (action === "resume") await api("/v1/windows/" + encodeURIComponent(id) + "/resume", { method: "POST" });
    else if (action === "disable") {
      if (!confirm("确定停用会话 " + id + "？会离场，并释放它名下的写锁与认领。\n（案卷不会被自动封卷——只有「事做完」才封；要收工请显式中止/办结。）")) return;
      await api("/v1/windows/" + encodeURIComponent(id) + "/leave", { method: "POST" });
    }
    await loadWindows(); await loadCases(); await loadActivity();
    if (state.settingsTarget && state.settingsTarget.kind === "human") openSettings("human", "human");
    else closeSettings();
  } catch (e) { alert("操作失败：" + e.message); }
}
async function doCase(action, cidOpt) {
  const id = cidOpt || (state.settingsTarget && state.settingsTarget.id);
  try {
    await api("/v1/cases/" + encodeURIComponent(id) + "/" + action, { method: "POST" });
    await loadCases(); await loadProjects(); await loadActivity();
    if (state.settingsTarget && state.settingsTarget.kind === "human") openSettings("human", "human");
    else closeSettings();
  } catch (e) { alert("操作失败：" + e.message); }
}

// 点击编号复制（捕获阶段，先于所在行的点击行为）
document.addEventListener("click", ev => {
  const cel = ev.target && ev.target.closest ? ev.target.closest(".copy") : null;
  if (!cel) return;
  ev.stopPropagation();
  ev.preventDefault();
  const text = cel.dataset.copy || (cel.textContent || "").trim();
  if (!text || text === "—") return;
  try { if (navigator.clipboard) navigator.clipboard.writeText(text); } catch (_) {}
  cel.classList.add("copied");
  setTimeout(() => cel.classList.remove("copied"), 900);
}, true);

document.getElementById("modal-body").addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "create-project") createProject();
  else if (act === "save-project") saveProject();
  else if (act === "archive-project") archiveProject(true);
  else if (act === "unarchive-project") archiveProject(false);
  else if (act === "crew-up") crewAction("up");
  else if (act === "crew-down") crewAction("down");
  else if (act === "create-case") createCaseFromSettings();
  else if (act === "pause-window") doWindow("pause", el.dataset.wid);
  else if (act === "resume-window") doWindow("resume", el.dataset.wid);
  else if (act === "disable-window") doWindow("disable", el.dataset.wid);
  else if (act === "pause-case") doCase("pause", el.dataset.cid);
  else if (act === "resume-case") doCase("resume", el.dataset.cid);
  else if (act === "abort-case") doCase("abort", el.dataset.cid);
  else if (act === "close-case") doCase("close", el.dataset.cid);
  else if (act === "reopen-case") doCase("reopen", el.dataset.cid);
  else if (act === "refresh-stat") refreshWindowStatus();
  else if (act === "send-human") sendHuman();
  else if (act === "back-mail") openSettings(state.mailAgent === "human" ? "human" : "agent", state.mailAgent);
  else if (act === "goto-window") {
    const pid = state.settingsTarget && state.settingsTarget.id;
    state.selectedProject = pid || null;
    state.selectedWindow = el.dataset.wid;
    closeSettings(); render();
  }
  else if (act === "goto-case") openSettings("case", el.dataset.cid);
  else if (act === "open-window-settings") openSettings("window", el.dataset.wid);
  else if (act === "open-window-status") openSettings("window-status", el.dataset.wid);
});
document.getElementById("btn-new-project").addEventListener("click", () => openSettings("new-project", null));
document.getElementById("btn-toggle-archived").addEventListener("click", () => {
  state.showArchived = !state.showArchived;
  document.getElementById("btn-toggle-archived").textContent = state.showArchived ? "隐藏归档" : "显示归档";
  render();
});
document.getElementById("modal-close").addEventListener("click", closeSettings);
document.getElementById("f-proj").addEventListener("change", e => { state.activityFilters.project = e.target.value; render(); });
document.getElementById("f-agent").addEventListener("change", e => { state.activityFilters.agent = e.target.value; render(); });
document.getElementById("f-case").addEventListener("change", e => { state.activityFilters.case = e.target.value; render(); });
document.getElementById("f-q").addEventListener("input", e => { state.activityFilters.q = e.target.value.trim(); render(); });
document.getElementById("f-case-status").addEventListener("change", e => { state.caseStatus = e.target.value; render(); });
document.getElementById("btn-sessions").addEventListener("click", openSessions);
async function refreshAll() {
  await loadProjects(); await loadWindows(); await loadCases(); await loadAgents(); await loadActivity(); await loadHeadless(); await loadDaemons(); await loadRuns();
}
document.getElementById("btn-refresh").addEventListener("click", async ev => {
  const b = ev.currentTarget;
  b.classList.add("spin");
  try { await refreshAll(); } finally { setTimeout(() => b.classList.remove("spin"), 800); }
});
function spinRefresh(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("click", async ev => {
    const b = ev.currentTarget;
    b.classList.add("spin");
    try { await fn(); } finally { setTimeout(() => b.classList.remove("spin"), 700); }
  });
}
spinRefresh("btn-r-wbs", () => loadCases());
spinRefresh("btn-r-case", () => loadCases());
spinRefresh("btn-r-act", () => loadActivity());
spinRefresh("btn-r-agents", async () => { await loadAgents(); await loadHeadless(); await loadDaemons(); });
async function waitHealthy() {
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 1500));
    try { const res = await fetch("/health", { cache: "no-store" }); if (res.ok) return true; } catch (_) {}
  }
  return false;
}
document.getElementById("btn-restart").addEventListener("click", async ev => {
  if (!confirm("一键重启：服务端 + 全部运行中的项目守护。\n\n会打断正在跑的 headless，并按其契约中止+封卷相关未结案卷。确定？")) return;
  const b = ev.currentTarget;
  b.disabled = true;
  b.textContent = "重启中…";
  try {
    const r = await api("/v1/restart", { method: "POST", body: {} });
    alert("已下发重启：服务端 + " + ((r.projects || []).length) + " 个项目守护。\n页面会短暂不可用，正在等待恢复…");
    await waitHealthy();
    await refreshAll();
    alert("重启完成。");
  } catch (e) {
    alert("重启失败：" + e.message);
  } finally {
    b.disabled = false;
    b.textContent = "重启";
  }
});document.getElementById("modal-overlay").addEventListener("click", ev => { if (ev.target.id === "modal-overlay") closeSettings(); });

// 初始化
loadProjects();
loadWindows();
loadCases();
loadAgents();
loadActivity();
loadHeadless();
loadDaemons();
loadRuns();
syncActivityFilters();

// 深链：#human 打开干预中枢，#agent/<名> 打开某 agent 的信件往来
setTimeout(() => {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (h === "human") openSettings("human", "human");
  else if (h.startsWith("agent/")) openSettings("agent", h.slice(6));
}, 700);
</script>
</body>
